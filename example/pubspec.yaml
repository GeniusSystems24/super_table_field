name: super_table_field_example
description: Runnable gallery for the super_table_field Flutter package.

publish_to: none
# version
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Companion packages imported explicitly by the gallery; super_table_field does not re-export them.
  super_core: ">=3.6.0 <4.0.0"
  super_form_field: ">=1.12.0 <2.0.0"
  super_auto_suggestion_box: ">=1.6.0 <2.0.0"
  super_table_field:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
