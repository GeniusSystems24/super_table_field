publish_to: none
# version
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared GeniusLink foundation (transitive via the package; listed for resolution).
  super_core: ">=3.3.0 <4.0.0"
